name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  # Optional: deploy to Vercel from CI. Requires the VERCEL_TOKEN,
  # VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets — the job is skipped until
  # they are set. The simpler alternative is Vercel's built-in Git integration
  # (no workflow needed).
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.VERCEL_TOKEN != ''
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull Vercel project settings
        uses: vercel/actions/pull@v2
        id: pull
        with:
          env: production

      - name: Build project artifacts
        uses: vercel/actions/build@v2
        with:
          id: ${{ steps.pull.outputs.id }}

      - name: Deploy to Vercel
        uses: vercel/actions/deploy@v2
        with:
          id: ${{ steps.pull.outputs.id }}